[metadata]
name = pbootr
version = attr: pbootr.__version__
author = Pallets
author_email = contact@palletsprojects.com
license = BSD-3-Clause
license_file = LICENSE.rst
description = A basic blog app built with pboot-pbatis.
long_description = file: README.rst

[options]
packages = find:
include_package_data = true
python_requires = >= 3.8
install_requires =
    Pboot>=2.2
    pboot-pbatis>=3.1.0

[options.extras_require]
test =
    pytest
    coverage

[tool:pytest]
testpaths = tests

[coverage:run]
branch = True
source = pbootr
